name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: unittests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show interpreter
        run: python -V

      - name: Run unit tests (core logic, no dify_plugin SDK required)
        run: python -m unittest discover -s tests -v