version: 0.1.0
type: plugin
author: mrkeyoe
name: cost_aware_strategy
label:
  en_US: Cost-Aware Agent Strategy
  zh_Hans: 成本感知 Agent 策略
description:
  en_US: >-
    A budget-aware agent strategy for Dify. Before every tool call it estimates a
    relative cost from table row-count metadata and the SQL shape (partition /
    index / WHERE selectivity / LIMIT), blocks calls that would exceed the run
    budget, and injects a structured degradation hint so the LLM can re-plan
    with sampling, pre-aggregation or a narrower time range.
  zh_Hans: >-
    为 Dify 提供预算感知的 Agent 策略：每次工具调用前基于表行数元数据与 SQL 形状
    （分区 / 索引 / WHERE 选择性 / LIMIT）估算相对成本，超出本次运行预算则阻止执行，
    并向 LLM 注入结构化降级提示，引导其改用采样查询、聚合表或缩小时间范围。
icon: icon.svg
privacy: PRIVACY.md
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
    model:
      enabled: true
plugins:
  agent_strategies:
    - provider/cost_aware_strategy.yaml
meta:
  version: 0.1.0
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
created_at: "2026-10-24T00:00:00Z"
tags:
  - agent-strategy
  - cost
  - budget
  - sql